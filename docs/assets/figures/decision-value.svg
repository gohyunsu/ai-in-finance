<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" role="img" aria-labelledby="title desc">
<title id="title">정보가 의사결정의 가치를 만드는 경로</title>
<desc id="desc">신호는 확률 판단을 바꾸고, 그 결과 최적 행동이 바뀔 때 가치가 생긴다.</desc>
<rect width="860" height="260" rx="12" fill="#f8fbfc"/>
<g font-family="Noto Sans KR,Malgun Gothic,sans-serif" text-anchor="middle">
<rect x="30" y="64" width="170" height="108" rx="12" fill="#e7f0f6" stroke="#9fb8ca"/>
<text x="115" y="105" font-size="18" font-weight="700" fill="#173655">새로운 신호</text>
<text x="115" y="135" font-size="14" fill="#526a7b">공시 · 뉴스 · 가격</text>
<path d="M202 118 H260" fill="none" stroke="#146d70" stroke-width="3"/>
<path d="m250 109 11 9-11 9" fill="none" stroke="#146d70" stroke-width="3"/>
<rect x="264" y="64" width="170" height="108" rx="12" fill="#e6f1f0" stroke="#8ab8b4"/>
<text x="349" y="105" font-size="18" font-weight="700" fill="#174e57">믿음의 갱신</text>
<text x="349" y="135" font-size="14" fill="#526a7b">상태별 확률 변화</text>
<path d="M436 118 H494" fill="none" stroke="#146d70" stroke-width="3"/>
<path d="m484 109 11 9-11 9" fill="none" stroke="#146d70" stroke-width="3"/>
<rect x="498" y="64" width="150" height="108" rx="12" fill="#edf3f8" stroke="#a9bdce"/>
<text x="573" y="105" font-size="18" font-weight="700" fill="#173655">행동 선택</text>
<text x="573" y="135" font-size="14" fill="#526a7b">보유 · 매수 · 매도</text>
<path d="M650 118 H708" fill="none" stroke="#146d70" stroke-width="3"/>
<path d="m698 109 11 9-11 9" fill="none" stroke="#146d70" stroke-width="3"/>
<rect x="712" y="64" width="118" height="108" rx="12" fill="#173655"/>
<text x="771" y="105" font-size="18" font-weight="700" fill="#fff">기대효용</text>
<text x="771" y="135" font-size="14" fill="#cce7e4">손실과 편익</text>
<text x="430" y="221" font-size="15" fill="#3d586c">행동이 그대로라면 추가 예측의 의사결정 가치는 0</text>
</g>
</svg>
